<style>
  :root{
    --oliva:#23261c;
    --oliva-hondo:#15170f;
    --oliva-claro:#3a3b2c;
    --celeste:#8cbfcc;

    --oro:#c9a24a;
    --casaca:#14161d;

  *{box-sizing:border-box}

  /* Fondo de óleo: oliva oscuro con luz cálida detrás de la cabeza */
  #escena{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 40% 45% at 38% 30%, rgba(214,170,110,.22), transparent 70%),
      radial-gradient(ellipse 90% 80% at 40% 40%, var(--oliva-claro) 0%, var(--oliva) 50%, var(--oliva-hondo) 100%);
  }
  #escena::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 40% 45%, transparent 55%, rgba(0,0,0,.5) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.08'/></svg>");
  }
  .vista #panel, .vista #ayuda, .vista #btnFrente{display:none !important}

  canvas:active{cursor:grabbing}

  #ayuda{
    position:fixed;z-index:1;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);margin:0;max-width:30ch;
    font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35;color:var(--crema);opacity:.9;
    pointer-events:none;transition:opacity 1.2s;padding:8px 14px;border-radius:12px;background:rgba(21,23,15,.62);

  #btnFrente{

  }

  #btnDemo:hover{opacity:1}
  :focus-visible{outline:2px solid var(--oro);outline-offset:3px}
  .oculto{position:absolute;left:-9999px}

  @media (max-width:820px), (orientation:portrait){
    #panel{
      top:auto;left:0;width:auto;height:min(42vh,340px);
      padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 14px);gap:8px;
      background:linear-gradient(to bottom, rgba(21,23,15,0) 0%, rgba(21,23,15,.86) 16%, rgba(21,23,15,.95) 100%);
    }
    #panel::before{display:none}
    .cabecera{padding-left:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    h1{font-size:26px}
    .cabecera p{font-size:15px;margin:0}
    #estado{margin:0 0 0 auto;font-size:14px}
    #subtitulo{padding-left:0;font-size:17px;justify-content:flex-start}
    #controles{padding-left:0}
    #btnHablar{width:58px;height:58px;font-size:13px}
    #btnEnviar{display:none}
    #ayuda{left:14px;right:auto;top:calc(env(safe-area-inset-top,0px) + 14px);bottom:auto;font-size:15px;max-width:26ch}
    #btnFrente{left:auto;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:15px}
  }
  @media (prefers-reduced-motion: reduce){ #estado[data-modo="conectando"] .punto{animation:none} #ayuda{transition:none} }
</style>

function azar(semilla){ return () => (semilla = (semilla * 16807) % 2147483647) / 2147483647; }

// Bordado de oro: tallo ondulante, volutas, hojas y rosetas (cuello, pechera y puños)
function texturaBordado(w = 256, h = 1024, semilla = 7){
  const lienzos = [document.createElement('canvas'), document.createElement('canvas')];
  lienzos.forEach(c => { c.width = w; c.height = h; });
  lienzos.forEach((c, modo) => {
    const ctx = c.getContext('2d'); const r = azar(semilla);
    ctx.fillStyle = modo === 0 ? AP.ropa.color : '#000'; ctx.fillRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const [or, og, ob] = rgbDe(AP.ropa.colorBordado);
    const oro = (k) => modo === 0 ? `rgb(${Math.min(255, or*(0.82 + k*0.3))|0},${Math.min(255, og*(0.82 + k*0.3))|0},${Math.min(255, ob*(0.82 + k*0.3))|0})` : `rgb(${200 + k*55|0},${200 + k*55|0},${200 + k*55|0})`;
    const sombra = modo === 0 ? `rgba(${or*0.3|0},${og*0.3|0},${ob*0.3|0},.9)` : '#555';
    const tallo = y => w/2 + Math.sin(y / h * Math.PI * 7) * w * 0.17;
    const trazo = (fn, ancho, k) => { ctx.strokeStyle = sombra; ctx.lineWidth = ancho * 1.5; ctx.beginPath(); fn(); ctx.stroke(); ctx.strokeStyle = oro(k); ctx.lineWidth = ancho; ctx.beginPath(); fn(); ctx.stroke(); };
    trazo(() => { for (let y = -10; y <= h + 10; y += 4){ y < 0 ? ctx.moveTo(tallo(y), y) : ctx.lineTo(tallo(y), y); } }, w*0.045, 0.6);
    const n = 7;
    for (let i = 0; i < n*2; i++){
      const y = (i + 0.5) * h / (n*2), lado = i % 2 ? 1 : -1, cx = tallo(y) + lado*w*0.2;
      trazo(() => { for (let a = 0; a < Math.PI*3.1; a += 0.12){ const rr = w*0.15*(1 - a/(Math.PI*3.4)); const x = cx + Math.cos(a)*rr*lado, yy = y + Math.sin(a)*rr; a === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); } }, w*0.028, r());
      for (let j = 0; j < 3; j++){
        const ang = -lado*0.6 + (j - 1)*0.7 + r()*0.3, lx = tallo(y) + Math.cos(ang)*w*0.08*lado, ly = y + Math.sin(ang)*w*0.12;
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(ang);
        ctx.fillStyle = sombra; ctx.beginPath(); ctx.ellipse(0, 0, w*0.075, w*0.03, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = oro(0.4 + r()*0.6); ctx.beginPath(); ctx.ellipse(0, 0, w*0.065, w*0.022, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      if (i % 2 === 0){ // roseta
        const fx = tallo(y + h/(n*4)), fy = y + h/(n*4);
        for (let p = 0; p < 8; p++){ const a = p/8*Math.PI*2; ctx.fillStyle = oro(0.5 + 0.5*Math.cos(a)); ctx.beginPath(); ctx.arc(fx + Math.cos(a)*w*0.06, fy + Math.sin(a)*w*0.06, w*0.035, 0, Math.PI*2); ctx.fill(); }
        ctx.fillStyle = modo === 0 ? `rgb(${or*0.45|0},${og*0.45|0},${ob*0.45|0})` : '#444'; ctx.beginPath(); ctx.arc(fx, fy, w*0.04, 0, Math.PI*2); ctx.fill();
      }
    }
    trazo(() => { ctx.moveTo(w*0.05, -5); ctx.lineTo(w*0.05, h + 5); ctx.moveTo(w*0.95, -5); ctx.lineTo(w*0.95, h + 5); }, w*0.03, 0.8);
  });
  const mapa = new THREE.CanvasTexture(lienzos[0]); mapa.colorSpace = THREE.SRGBColorSpace;
  const mascara = new THREE.CanvasTexture(lienzos[1]);
  for (const t of [mapa, mascara]){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; }
  return { mapa, mascara };
}
function materialBordado(repX = 1, repY = 1, girar = false){

/* ---------------- Rostro esculpido ----------------
   Una sola malla de piel deformada vértice a vértice (cráneo, órbitas, pómulos,
   nariz, labios, mentón) con cuatro blendshapes para hablar:
   abrir (A), ancho (E/I), redondo (O/U) y cerrar (M/B/P).
   La boca es una franja de vértices que en reposo queda comprimida en una línea
   y que, al abrirse, se despliega hacia adentro formando la cavidad. */
const BOCA = { y:-0.054, ancho:0.0245, s0:0.0058, k:0.07 };
const OJO = { x:0.034, y:0.0185, r:0.0123 };
const BAJA = { abrir:0.0205, ancho:0.0035, redondo:0.009 };   // cuánto baja el labio inferior en cada forma
const SUBE = { abrir:0.0028, ancho:0.0014, redondo:0.0022 };
const g2 = (x, y, cx, cy, sx, sy) => Math.exp(-(((x - cx)/sx)**2) - (((y - cy)/sy)**2));
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a)/(b - a))); return t*t*(3 - 2*t); };
function curva(puntos, t){ // interpolación suave entre puntos [t, valor]
  if (t <= puntos[0][0]) return puntos[0][1];
  for (let i = 1; i < puntos.length; i++){
    const [t1, v1] = puntos[i];
    if (t <= t1){ const [t0, v0] = puntos[i-1]; const k = (t - t0)/(t1 - t0); return v0 + (v1 - v0)*(k*k*(3 - 2*k)); }
  }
  return puntos[puntos.length-1][1];
}
const NARIZ_ALTO = [[-0.18,0],[0,0.0034],[0.25,0.0088],[0.55,0.016],[0.78,0.0238],[0.885,0.0262],[0.95,0.0228],[1.0,0.0135],[1.06,0.003],[1.12,0]];
const NARIZ_ANCHO = [[0,0.0066],[0.5,0.0078],[0.8,0.0102],[0.92,0.0122],[1.0,0.0118],[1.12,0.009]];

function formaBase(dx, dy, dz){
  let x = dx*0.087*F.ancho, y = dy*0.12;
  let z = dz >= 0 ? 0.097*Math.pow(dz, 0.8) : -0.108*Math.pow(-dz, 0.92);
  if (dy > 0){ x *= 1 + 0.045*dy; if (dz > 0) z *= 1 - 0.1*sstep(0.35, 0.95, dy); }
  if (dy < 0){ const t = Math.pow(-dy, 1.5); x *= 1 - (0.13 + (1 - F.mandibula)*0.12)*t; z = z >= 0 ? z*(1 - 0.04*t) : z*(1 - 0.38*t); }
  return [x, y, z];
}

// Devuelve la posición del vértice para un juego de blendshapes P y, si se pide, su color
function esculpir(d, P, col){
  let [x, y0, z] = formaBase(d.x, d.y, d.z);
  const fm = sstep(0.12, 0.5, d.z);                 // frente de la cara
  const ax = Math.abs(x), sg = Math.sign(x) || 1;
  const ym = BOCA.y, s0 = BOCA.s0;
  const u = x/BOCA.ancho;
  const cu = (1 - sstep(0.82, 1.12, Math.abs(u)))*sstep(0.45, 0.75, d.z);
  const ue = Math.abs(u)/(1 - 0.3*P.redondo + 0.12*P.ancho);
  const sh = ue < 1 ? Math.pow(1 - ue*ue, 0.6) : 0;
  const baja = BAJA.abrir*P.abrir + BAJA.ancho*P.ancho + BAJA.redondo*P.redondo;
  const sube = SUBE.abrir*P.abrir + SUBE.ancho*P.ancho + SUBE.redondo*P.redondo;
  const hondo = 0.0028 + 0.02*Math.min(1, baja/BAJA.abrir);

  // Franja de la boca: comprimida en reposo, desplegada al hablar
  const dy = y0 - ym;
  let Y, abrirY = 0, zIn = 0, q = 2;
  if (Math.abs(dy) <= s0){
    q = dy/s0;
    Y = ym + dy*(1 - (1 - BOCA.k)*cu);
    abrirY = (q < 0 ? q*baja : q*sube)*sh*cu;
    zIn = -hondo*(1 - q*q)*cu*(0.15 + 0.85*sh);
  } else {
    const e = Math.abs(dy) - s0, lado = Math.sign(dy);
    Y = y0 - lado*s0*(1 - BOCA.k)*cu*Math.exp(-e/0.007);
    if (lado > 0) abrirY = sube*sh*cu*Math.exp(-e/0.012);
    else {
      const amplio = (1 - sstep(0.03, 0.078, ax))*sstep(-0.35, 0.25, d.z);
      const mand = sh*cu + (amplio - sh*cu)*sstep(0, 0.016, e);
      abrirY = -baja*mand;
      zIn -= 0.3*baja*mand;
    }
  }

  // Rasgos (en coordenadas de reposo, para que los labios viajen con la boca)
  const Yr = Y;
  let dz = 0, dxl = 0;
  dz -= 0.0105*g2(ax, Yr, OJO.x, OJO.y, 0.0175, 0.0135);            // órbitas
  dz += 0.0042*g2(ax, Yr, 0.036, 0.0335, 0.016, 0.0058);            // pliegue del párpado

function crearRostro(){

  geo.morphAttributes.position = []; geo.morphAttributes.normal = [];
  const dic = {};
  for (const [nombre, P] of Object.entries(formas)){
    const arr = new Float32Array(n*3);
    for (let i = 0; i < n; i++){ d.fromArray(dirs, i*3); arr.set(esculpir(d, P), i*3); }
    const tmp = new THREE.BufferGeometry(); tmp.setAttribute('position', new THREE.BufferAttribute(arr, 3)); tmp.setIndex(geo.index); tmp.computeVertexNormals();
    dic[nombre] = geo.morphAttributes.position.length;
    geo.morphAttributes.position.push(new THREE.BufferAttribute(arr, 3));
    geo.morphAttributes.normal.push(tmp.attributes.normal);
  }
  let matPiel = M.piel;
  if (FOTO){
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(col.uv, 2));
    geo.setAttribute('pesoFoto', new THREE.Float32BufferAttribute(col.peso, 1));
    const tex = new THREE.TextureLoader().load(AP.foto); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    matPiel = M.piel.clone(); matPiel.map = tex;

      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float pesoFoto;\nvarying float vPesoFoto;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPesoFoto = pesoFoto;');

function mascaraPelo(x, y, z){
  // 0..1: dónde crece el pelo. Coronilla con entradas, nuca, sienes y patillas
  const P = AP.pelo, ax = Math.abs(x)/F.ancho;
  const linea = 0.072 - 0.022*sstep(0.03, 0.07, ax) + 0.006*(ruido3(x*90, 1.7, z*90) - 0.5) + P.entradas*0.058*(1 - 0.45*sstep(0.03, 0.07, ax));
  const arriba = sstep(linea - 0.012, linea + 0.012, y);
  const lado = sstep(0.05, 0.064, ax);
  const frontal = sstep(0.004, 0.012, z)*lado;                                  // delante de la oreja
  const oreja = sstep(-0.05, -0.03, z)*sstep(0.016, 0.002, z)*lado*(1 - sstep(0.15, 0.45, P.largo)); // la oreja queda libre, salvo con melena
  const nuca = -0.079 + 0.03*sstep(0.03, 0.074, ax)*sstep(-0.085, -0.035, z)*(1 - P.largo) - 0.05*P.largo;
  let borde = nuca*(1 - oreja) + 0.026*oreja;
  borde = borde*(1 - frontal) + (P.patillas ? -0.064 : 0.03)*frontal;
  const frenteP = 0.05 - 0.016*sstep(0.0, -0.06, y);
  const abajo = sstep(borde - 0.01, borde + 0.01, y)*sstep(frenteP, frenteP - 0.016, z)*Math.max(sstep(0.045, 0.062, ax), sstep(0.02, -0.02, z));
  return [Math.max(arriba, abajo), linea];
}

function mascaraBarba(x, y, z, dz){

    const r = malla(g, M.pelo); r.scale.set(1.15, 0.95, 0.85); r.position.set(0, 0.035, -0.112); grupo.add(r);
  }
  return grupo;
}

/* ---------------- Oso melero (tamanduá) estilo animación ----------------
   Cráneo crema, hocico largo que oscurece hacia la punta, nariz brillante, boquita
   que se abre al hablar, lengua que asoma, ojos grandes con anillos oscuros y orejas redondas. */
function crearCabezaMelero(cabeza, Rp){
  const mh = new THREE.Group(); mh.scale.setScalar(1.32); mh.position.set(0, 0.03, -0.015); cabeza.add(mh);
  const crema = C3(AP.piel), claro = mezcla(AP.piel, '#fff4dc', 0.35), gris = C3('#8a7c6c'), oscuro = C3('#2a2420');
  const pelaje = (opts = {}) => new THREE.MeshPhysicalMaterial({ color:0xffffff, vertexColors:true, roughness:0.72, sheen:0.7, sheenColor:new THREE.Color(0xfff0d8), sheenRoughness:0.6, ...opts });
  // Cráneo
  const gCr = new THREE.SphereGeometry(1, 48, 36);
  pintarVertices(gCr, (d, c) => { c.copy(crema).lerp(claro, sstep(0.1, 0.9, d.y)*0.6); c.lerp(gris, sstep(0.3, 0.9, d.z)*sstep(0.1, -0.5, d.y)*0.35); c.multiplyScalar(0.96 + 0.08*ruido3(d.x*15, d.y*15, d.z*15)); });
  const craneo = malla(gCr, pelaje()); craneo.scale.set(0.104, 0.098, 0.108); craneo.position.set(0, 0.02, -0.005); mh.add(craneo);
  // Mejillas abultadas que unen el cráneo con el hocico
  const gMej = new THREE.SphereGeometry(1, 32, 24);
  pintarVertices(gMej, (d, c) => c.copy(crema).lerp(gris, sstep(0.2, 0.9, d.z)*0.5));
  const mejillas = malla(gMej, pelaje()); mejillas.scale.set(0.074, 0.062, 0.07); mejillas.position.set(0, -0.012, 0.045); mh.add(mejillas);
  // Hocico: torno a lo largo de +y, girado hacia adelante y un poco abajo
  const perfilH = [[0.066, 0], [0.062, 0.03], [0.053, 0.07], [0.043, 0.11], [0.034, 0.15], [0.028, 0.18], [0.025, 0.2], [0.017, 0.212], [0.001, 0.216]];
  const gH = new THREE.LatheGeometry(perfilH.map(([r, y]) => new THREE.Vector2(r, y)), 40);
  { const p = gH.attributes.position, cols = [], c = new THREE.Color();
    for (let i = 0; i < p.count; i++){ const t = p.getY(i)/0.216; c.copy(crema).lerp(gris, sstep(0.18, 0.45, t)).lerp(oscuro, sstep(0.72, 0.98, t)); cols.push(c.r, c.g, c.b); }
    gH.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); gH.computeVertexNormals(); }
  const hocico = new THREE.Group(); hocico.position.set(0, -0.01, 0.06); hocico.rotation.x = Math.PI/2 + 0.5; mh.add(hocico);
  hocico.add(malla(gH, pelaje({ sheen:0.4 })));
  const nariz = esfera(0.03, M.narizM, 1.1, 0.75, 0.85, 32); nariz.position.set(0, 0.214, 0.004); hocico.add(nariz);
  for (const s of [-1, 1]){ const n = esfera(0.006, new THREE.MeshStandardMaterial({ color:0x050404, roughness:0.9 }), 1, 1.4, 0.6, 12); n.position.set(s*0.012, 0.236, 0.008); hocico.add(n); }
  // Boca en la punta del hocico: labio inferior articulado, interior oscuro y lengua
  const boca = new THREE.Group(); boca.position.set(0, 0.19, -0.022); hocico.add(boca);
  const interior = esfera(0.014, new THREE.MeshStandardMaterial({ color:0x3a1414, roughness:0.8 }), 1.2, 0.5, 1); interior.position.set(0, 0.01, 0.004); boca.add(interior);
  const labio = new THREE.Group(); boca.add(labio);
  const lab = esfera(0.016, pelaje({ vertexColors:false, color:mezcla('#8a7c6c', '#2a2420', 0.55) }), 1.25, 0.45, 1.0, 24); lab.position.set(0, 0.012, -0.004); labio.add(lab);
  const lengua = malla(new THREE.CylinderGeometry(0.0045, 0.006, 0.1, 10), new THREE.MeshPhysicalMaterial({ color:0xd8707a, roughness:0.35, clearcoat:0.6 }));
  lengua.position.set(0, -0.02, 0.002); boca.add(lengua);
  // Ojos grandes con anillo oscuro; reutilizan el globo ocular pintado del motor
  const ojos = [], parpados = [], cejas = [];
  for (const s of [-1, 1]){
    const pos = new THREE.Vector3(s*0.056, 0.045, 0.074);
    const anillo = esfera(0.036, pelaje({ vertexColors:false, color:mezcla('#3a2e26', AP.piel, 0.18) }), 1, 0.92, 0.4, 32); anillo.position.copy(pos).add(new THREE.Vector3(0, 0, -0.012)); anillo.lookAt(pos.clone().multiplyScalar(2.5)); mh.add(anillo);
    const ojo = new THREE.Group(); ojo.position.copy(pos); mh.add(ojo);
    ojo.add(malla(new THREE.SphereGeometry(0.027, 40, 30), M.ojo));
    ojos.push(ojo);
    const pv = new THREE.Group(); pv.position.copy(pos); mh.add(pv);
    const sup = malla(new THREE.SphereGeometry(0.029, 32, 16, 0, Math.PI*2, 0, Math.PI*0.5), pelaje({ vertexColors:false, color:mezcla('#3a2e26', AP.piel, 0.3) })); sup.rotation.x = -0.6; pv.add(sup);
    parpados.push(sup);
    const ceja = malla(new THREE.CapsuleGeometry(0.0055, 0.03, 6, 12), pelaje({ vertexColors:false, color:mezcla(AP.piel, '#5a4632', 0.45) }));
    ceja.rotation.z = Math.PI/2 + s*0.18; ceja.position.set(s*0.058, 0.085, 0.07); ceja.userData.s = s; mh.add(ceja); cejas.push(ceja);
  }
  // Orejas redondas
  for (const s of [-1, 1]){
    const o = new THREE.Group(); o.position.set(s*0.078, 0.09, -0.025); o.rotation.set(-0.15, s*0.45, s*-0.35); mh.add(o);
    const ext = esfera(1, pelaje({ vertexColors:false, color:crema.clone() }), 0.036, 0.048, 0.014, 28); o.add(ext);
    const int = esfera(1, new THREE.MeshStandardMaterial({ color:0x5a3a34, roughness:0.7 }), 0.026, 0.036, 0.008, 24); int.position.z = 0.009; o.add(int);
    o.userData.s = s;
  }
  Rp.mel = { boca, labio, lengua, ojos, parpados, cejas, orejas: mh.children.filter(c => c.userData.s && c.isGroup), lenguaFuera: 0, proxLengua: 4 };
}

/* ---------------- Figura humana ---------------- */
function crearPersona(){
  const raiz = new THREE.Group();
  const R = {};
  // "pecho": pivote en la cintura para inclinar y girar todo el torso
  const pecho = new THREE.Group(); pecho.position.y = 0.95; raiz.add(pecho);
  const cuerpo = new THREE.Group(); cuerpo.position.y = -0.95; pecho.add(cuerpo);
  R.pecho = pecho;

  /* Casaca */
  const torso = new THREE.Group(); cuerpo.add(torso); R.torso = torso;
  const perfil = [[0.001,1.445],[0.075,1.445],[0.16,1.418],[0.205,1.372],[0.215,1.30],[0.207,1.20],[0.19,1.08],[0.184,0.98],[0.192,0.8],[0.2,0.62],[0.001,0.62]];
  const radioEn = y => { for (let i = 1; i < perfil.length-1; i++){ const [r0,y0] = perfil[i], [r1,y1] = perfil[i+1]; if (y <= y0 && y >= y1) return r0 + (r1-r0)*(y0-y)/(y0-y1); } return 0.19; };
  const PROF = 0.64;
  const casaca = malla(new THREE.LatheGeometry(perfil.map(([r,y]) => new THREE.Vector2(r, y)), 80), M.casaca);
  casaca.scale.z = PROF; torso.add(casaca);
  const TIPO = AP.ropa.tipo || 'casaca';
  const frenteEn = (x, y, extra = 0.004) => { const r = radioEn(y)*1.01; return PROF*Math.sqrt(Math.max(r*r - x*x, 0)) + extra; };
  const abierta = TIPO === 'traje' || TIPO === 'guardapolvo';
  // Pecheras bordadas a ambos lados de la abotonadura
  for (const [ini, largo] of (AP.ropa.bordado && !abierta ? [[0.04, 0.28], [-0.32, 0.28]] : [])){
    const banda = malla(new THREE.LatheGeometry(perfil.slice(1, 8).map(([r,y]) => new THREE.Vector2(r*1.01, y)), 24, ini, largo), M.bordado);
    banda.material = M.bordado.clone(); banda.material.side = THREE.DoubleSide;
    banda.scale.z = PROF; torso.add(banda);
  }
  // Botones según la prenda
  const boton = (x, y, mat, r = 0.0135) => { const b = esfera(r, mat, 1, 1, 0.55, 20); b.position.set(x, y, frenteEn(x, y)); torso.add(b); };
  if (TIPO === 'sotana') for (let y = 1.4; y >= 0.98; y -= 0.034) boton(0, y, M.detalle, 0.007);
  else if (TIPO === 'traje') { boton(0, 1.06, M.casaca, 0.011); boton(0, 0.98, M.casaca, 0.011); }
  else if (TIPO === 'guardapolvo') for (let y = 1.2; y >= 0.95; y -= 0.08) boton(0, y, M.camisa, 0.011);
  else if (TIPO !== 'poncho') for (let y = 1.34; y >= 1.02; y -= 0.064) boton(-0.034, y, M.oro);
  if (abierta){
    // Camisa y corbata a la vista entre las solapas
    const camisa = malla(new THREE.LatheGeometry(perfil.slice(1, MELERO ? 7 : 6).map(([r,y]) => new THREE.Vector2(r*1.012, y)), 16, MELERO ? -0.5 : -0.2, MELERO ? 1.0 : 0.4), MELERO ? M.chaleco : M.camisa);
    if (!MELERO){ camisa.material = M.camisa.clone(); camisa.material.side = THREE.DoubleSide; }
    camisa.scale.z = PROF; torso.add(camisa);
    for (const s of [-1, 1]){ // solapas: dos franjas de la prenda que bajan en V
      const forma = new THREE.Shape(); forma.moveTo(0, 0); forma.lineTo(s*0.045, 0); forma.lineTo(s*0.075, -0.2); forma.lineTo(s*0.012, -0.24); forma.lineTo(0, -0.04);
      const sol = malla(new THREE.ShapeGeometry(forma), M.casaca); sol.material = M.casaca.clone(); sol.material.side = THREE.DoubleSide;
      sol.position.set(s*0.022, 1.44, frenteEn(0.03, 1.36, 0.008)); sol.rotation.x = -0.32; torso.add(sol);
    }
    if (!MELERO){
      const nudo = malla(new THREE.BoxGeometry(0.026, 0.024, 0.014), M.detalle); nudo.position.set(0, 1.425, frenteEn(0, 1.425, 0.012)); torso.add(nudo);
      const corbata = malla(new THREE.CylinderGeometry(0.022, 0.012, 0.24, 4), M.detalle); corbata.rotation.y = Math.PI/4; corbata.scale.z = 0.25;
      corbata.position.set(0, 1.29, frenteEn(0, 1.3, 0.01)); corbata.rotation.x = -0.12; torso.add(corbata);
      const cuelloCamisa = malla(new THREE.CylinderGeometry(0.058, 0.062, 0.05, 32, 1, true, 0.5, Math.PI*2 - 1.0), M.camisa.clone());
      cuelloCamisa.material.side = THREE.DoubleSide; cuelloCamisa.position.y = 1.47; torso.add(cuelloCamisa);
    } else {
      // cuello grueso de pelaje y credencial con el nombre, como en la ilustración
      const cuelloM = malla(new THREE.CylinderGeometry(0.075, 0.09, 0.09, 32), M.manos); cuelloM.position.y = 1.47; torso.add(cuelloM);
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96; const cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, 256, 96); cx.strokeStyle = '#2a5aa8'; cx.lineWidth = 8; cx.strokeRect(4, 4, 248, 88);
      cx.fillStyle = '#16305e'; cx.font = 'bold 46px Arial, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText((PERSONA.corto || 'MELERO').toUpperCase().slice(0, 10), 128, 50);
      const credTex = new THREE.CanvasTexture(cv); credTex.colorSpace = THREE.SRGBColorSpace;
      const cred = malla(new THREE.PlaneGeometry(0.085, 0.032), new THREE.MeshStandardMaterial({ map:credTex, roughness:0.4 }));
      cred.position.set(0.085, 1.2, frenteEn(0.085, 1.2, 0.007)); cred.rotation.y = 0.42; torso.add(cred);
      const ce = document.createElement('canvas'); ce.width = 128; ce.height = 150; const e2 = ce.getContext('2d');
      e2.fillStyle = '#1f4f9a'; e2.beginPath(); e2.moveTo(8, 8); e2.lineTo(120, 8); e2.lineTo(120, 80); e2.quadraticCurveTo(120, 130, 64, 146); e2.quadraticCurveTo(8, 130, 8, 80); e2.closePath(); e2.fill();
      e2.fillStyle = '#f2c230'; e2.fillRect(18, 18, 92, 30); e2.fillStyle = '#1f4f9a'; e2.font = 'bold 20px Arial'; e2.textAlign = 'center'; e2.fillText('ESCUELA', 64, 40);
      e2.fillStyle = '#3f9a3a'; e2.fillRect(18, 56, 92, 50); e2.fillStyle = '#ffffff'; e2.fillRect(34, 66, 26, 30); e2.fillRect(66, 66, 26, 30);
      e2.fillStyle = '#ffffff'; e2.font = 'bold 15px Arial'; e2.fillText('FORMOSA', 64, 126);
      const escTex = new THREE.CanvasTexture(ce); escTex.colorSpace = THREE.SRGBColorSpace;
      const esc = malla(new THREE.PlaneGeometry(0.05, 0.058), new THREE.MeshStandardMaterial({ map:escTex, roughness:0.5, transparent:true, alphaTest:0.1 }));
      esc.position.set(0.09, 1.29, frenteEn(0.09, 1.29, 0.008)); esc.rotation.y = 0.45; torso.add(esc);
    }
  } else if (TIPO === 'vestido'){
    // Cuello alto de la prenda con volado de encaje y camafeo
    const cuelloV = malla(new THREE.CylinderGeometry(0.06, 0.066, 0.08, 40, 1, true), M.casaca.clone()); cuelloV.material.side = THREE.DoubleSide; cuelloV.position.y = 1.47; torso.add(cuelloV);
    for (let i = 0; i < 26; i++){ const a = i/26*Math.PI*2; const v = esfera(0.011, M.camisa, 1, 0.7, 0.6, 12); v.position.set(Math.sin(a)*0.064, 1.515, Math.cos(a)*0.064); torso.add(v); }
    const marco = malla(new THREE.TorusGeometry(0.016, 0.003, 8, 24), M.oro); marco.scale.y = 1.25; marco.position.set(0, 1.43, frenteEn(0, 1.43, 0.008)); torso.add(marco);
    const camafeo = esfera(0.015, M.papel, 1, 1.25, 0.3, 20); camafeo.position.copy(marco.position); torso.add(camafeo);
  } else if (TIPO === 'sotana'){
    const cuelloS = malla(new THREE.CylinderGeometry(0.062, 0.068, 0.08, 40, 1, true), M.casaca.clone()); cuelloS.material.side = THREE.DoubleSide; cuelloS.position.y = 1.47; torso.add(cuelloS);
    const alzacuello = malla(new THREE.BoxGeometry(0.024, 0.026, 0.006), M.camisa); alzacuello.position.set(0, 1.48, 0.066); torso.add(alzacuello);
  } else {
    // Cuello alto (bordado o liso), camisa blanca y corbatín
    const cuelloAlto = malla(new THREE.CylinderGeometry(0.064, 0.07, 0.095, 48, 1, true, 0.4, Math.PI*2 - 0.8), (AP.ropa.bordado ? M.bordadoCuello : M.casaca).clone());
    cuelloAlto.material.side = THREE.DoubleSide; cuelloAlto.position.y = 1.47; torso.add(cuelloAlto);
    const corbatin = malla(new THREE.CylinderGeometry(0.052, 0.056, 0.07, 24), M.corbatin); corbatin.position.set(0, 1.465, 0.01); torso.add(corbatin);
    for (const s of [-1, 1]){
      const punta = malla(new THREE.ConeGeometry(0.014, 0.034, 3), M.camisa);
      punta.position.set(s*0.021, 1.506, 0.052); punta.rotation.set(0.35, 0, s*2.6); punta.scale.z = 0.4; torso.add(punta);
    }
  }
  if (TIPO === 'poncho'){
    // Poncho corto sobre los hombros, con guarda en el borde
    const c = document.createElement('canvas'); c.width = 64; c.height = 256; const ctx = c.getContext('2d');
    ctx.fillStyle = AP.ropa.color; ctx.fillRect(0, 0, 64, 256);
    const det = AP.ropa.colorDetalle || '#7a1f24', clara = AP.ropa.colorBordado || '#e8e0d0';
    for (const [y0, alto, col] of [[188, 10, clara], [204, 22, det], [232, 8, clara], [246, 6, det]]){ ctx.fillStyle = col; ctx.fillRect(0, y0, 64, alto); }
    ctx.fillStyle = clara; for (let x = 0; x < 64; x += 16){ ctx.beginPath(); ctx.moveTo(x, 215); ctx.lineTo(x + 8, 207); ctx.lineTo(x + 16, 215); ctx.lineTo(x + 8, 223); ctx.fill(); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(10, 1);
    const perfilP = [[0.07, 1.475], [0.14, 1.445], [0.215, 1.41], [0.258, 1.36], [0.27, 1.27], [0.268, 1.16], [0.262, 1.06]];
    const geo = new THREE.LatheGeometry(perfilP.map(([r, y]) => new THREE.Vector2(r, y)), 64);
    const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
    const poncho = malla(geo, new THREE.MeshPhysicalMaterial({ map:tex, side:THREE.DoubleSide, roughness:0.9, sheen:0.4, sheenColor:new THREE.Color(0xffffff) }));
    poncho.scale.z = 0.72; torso.add(poncho);
  }
  // Charreteras de cordón trenzado; la izquierda lleva la estrella de plata
  for (const s of (AP.ropa.charreteras && TIPO !== 'poncho' ? [-1, 1] : [])){
    const ch = new THREE.Group(); ch.position.set(s*0.178, 1.398, -0.005); ch.rotation.z = -s*0.42; torso.add(ch);
    const base = esfera(0.07, M.bordado, 1, 0.3, 0.88); ch.add(base);
    for (let k = 0; k < 15; k++){
      const a = -1.5 + k*(3.0/14);
      const dir = new THREE.Vector3(s*Math.cos(a), 0, Math.sin(a)*0.85);
      const p0 = dir.clone().multiplyScalar(0.05);
      const p1 = dir.clone().multiplyScalar(0.075).add(new THREE.Vector3(0, -0.012, 0));
      const p2 = dir.clone().multiplyScalar(0.088).add(new THREE.Vector3(0, -0.04, 0));
      const p3 = dir.clone().multiplyScalar(0.084).add(new THREE.Vector3(0, -0.068, 0));
      ch.add(malla(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([p0, p1, p2, p3]), 20, 0.0135, 10), M.cordon));
    }
    if (s === 1){
      const forma = new THREE.Shape();
      for (let i = 0; i < 16; i++){ const rr = i % 2 ? 0.009 : 0.022, a = i/16*Math.PI*2; const x = Math.cos(a)*rr, y = Math.sin(a)*rr; i ? forma.lineTo(x, y) : forma.moveTo(x, y); }
      const estrella = malla(new THREE.ExtrudeGeometry(forma, { depth:0.003, bevelEnabled:false }), M.plata);
      estrella.rotation.x = -Math.PI/2; estrella.position.set(0, 0.02, 0.01); ch.add(estrella);
    }
  }

  /* Accesorios en el pecho */
  const EX = AP.extras || {};
  if (EX.medalla){
    const cinta = malla(new THREE.BoxGeometry(0.024, 0.038, 0.004), M.detalle); cinta.position.set(0.085, 1.27, frenteEn(0.085, 1.27, 0.006)); cinta.rotation.y = 0.45; torso.add(cinta);
    const disco = malla(new THREE.CylinderGeometry(0.019, 0.019, 0.004, 28), M.oro); disco.rotation.set(Math.PI/2, 0, 0); disco.position.set(0.087, 1.235, frenteEn(0.087, 1.235, 0.008)); disco.rotation.y = 0.45; torso.add(disco);
  }
  if (EX.escarapela){
    [[0.025, 0x74acdf, 0.006], [0.016, 0xf4f4f0, 0.009], [0.008, 0x74acdf, 0.012]].forEach(([r, col, dz]) => {
      const d = malla(new THREE.CylinderGeometry(r, r, 0.003, 32), new THREE.MeshStandardMaterial({ color:col, roughness:0.6 }));
      d.rotation.set(Math.PI/2, 0, 0); d.position.set(-0.09, 1.34, frenteEn(-0.09, 1.34, dz)); d.rotation.y = -0.5; torso.add(d);
    });
  }
  if (EX.panuelo){
    const t = new THREE.Shape(); t.moveTo(-0.05, 0); t.lineTo(0.05, 0); t.lineTo(0, -0.07); t.lineTo(-0.05, 0);
    const p = malla(new THREE.ShapeGeometry(t), M.detalle); p.material = M.detalle.clone(); p.material.side = THREE.DoubleSide;
    const zP = TIPO === 'poncho' ? 0.112 : 0.082;
    p.position.set(0, 1.45, zP); p.rotation.x = -0.25; torso.add(p);
    const nudoP = esfera(0.014, M.detalle); nudoP.position.set(0, 1.452, zP - 0.002); torso.add(nudoP);
  }

  /* Cuello y cabeza */
  const cuelloPiel = malla(MELERO ? new THREE.CylinderGeometry(0.07, 0.08, 0.13, 32) : new THREE.CylinderGeometry(0.047, 0.054, 0.13, 32), M.manos);
  cuelloPiel.position.y = 1.48; cuerpo.add(cuelloPiel);

  const cabeza = new THREE.Group(); cabeza.position.set(0, 1.612, 0.008); cabeza.scale.setScalar(1.1); cuerpo.add(cabeza); R.cabeza = cabeza;
  const piel = crearRostro();
  cabeza.add(piel.malla);
  R.rostro = piel.malla;

  // Dientes, lengua: la fila inferior y la lengua bajan con la mandíbula
  const zL = piel.zLabio;
  const dSup = malla(new THREE.CylinderGeometry(0.0225, 0.0215, 0.0072, 28, 1, true, -0.8, 1.6), M.diente);
  dSup.material = M.diente.clone(); dSup.material.side = THREE.DoubleSide;
  dSup.position.set(0, BOCA.y + 0.0042, zL - 0.0072 - 0.0225); cabeza.add(dSup);
  const mandibula = new THREE.Group(); cabeza.add(mandibula); R.mandibula = mandibula;
  const dInf = malla(new THREE.CylinderGeometry(0.0205, 0.02, 0.0062, 28, 1, true, -0.7, 1.4), dSup.material);

    const pest = malla(new THREE.TorusGeometry(OJO.r*1.085, 0.00075, 6, 40, Math.PI), M.pestana);

    helix.rotation.set(0, s*Math.PI/2, Math.PI*0.62); helix.scale.set(1, 1.25, 1); helix.position.set(s*0.0028, 0.001, -0.002); o.add(helix);
  }

  // Cabello y patillas en una sola pieza esculpida, con mechones rizados en las sienes
  { const pelo = crearPelo(); cabeza.add(pelo); R.pelo = pelo.children[0]; }
  if (EX.anteojos){
    const zA = piel.zOjo + OJO.r + 0.008, mat = M.negro;
    for (const s of [-1, 1]){
      const aro = malla(new THREE.TorusGeometry(0.0165, 0.0012, 8, 32), mat); aro.position.set(s*OJO.x, OJO.y, zA); cabeza.add(aro);
      const lente = malla(new THREE.CircleGeometry(0.016, 24), M.vidrio); lente.position.copy(aro.position); cabeza.add(lente);
      const pata = new THREE.CatmullRomCurve3([new THREE.Vector3(s*(OJO.x + 0.0165), OJO.y + 0.002, zA), new THREE.Vector3(s*0.078*F.ancho, OJO.y + 0.004, zA - 0.03), new THREE.Vector3(s*0.088*F.ancho, OJO.y - 0.004, -0.012)]);
      cabeza.add(malla(new THREE.TubeGeometry(pata, 12, 0.001, 6), mat));
    }
    const puente = new THREE.CatmullRomCurve3([new THREE.Vector3(-OJO.x + 0.0165, OJO.y + 0.002, zA), new THREE.Vector3(0, OJO.y + 0.006, zA + 0.004), new THREE.Vector3(OJO.x - 0.0165, OJO.y + 0.002, zA)]);
    cabeza.add(malla(new THREE.TubeGeometry(puente, 10, 0.0012, 6), mat));
  }
  if (MELERO){ for (const c of cabeza.children) c.visible = false; crearCabezaMelero(cabeza, R); }
  const topeCabeza = 0.118 + 0.012*(AP.pelo.volumen || 1)*(1 - (AP.pelo.entradas || 0)*0.7);
  if (EX.galera){
    const g = new THREE.Group(); g.position.set(0, topeCabeza - 0.012, -0.006); g.rotation.x = -0.12; cabeza.add(g);
    const ala = malla(new THREE.CylinderGeometry(0.128, 0.128, 0.006, 48), M.fieltro); g.add(ala);
    const copa = malla(new THREE.CylinderGeometry(0.09, 0.096, 0.16, 48), M.fieltro); copa.position.y = 0.083; g.add(copa);
    const cinta = malla(new THREE.CylinderGeometry(0.0965, 0.0965, 0.022, 48), M.detalle); cinta.position.y = 0.016; g.add(cinta);
  } else if (EX.sombrero){

  /* Brazos y manos */
  function crearBrazo(s){ // s = -1 brazo derecho del personaje (izquierda de la pantalla), +1 izquierdo
    const B = { s };
    B.hombro = new THREE.Group(); B.hombro.position.set(s*0.195, 1.37, 0); cuerpo.add(B.hombro);
    const brazo = malla(new THREE.CylinderGeometry(0.052, 0.045, 0.29, 24), M.casaca); brazo.position.y = -0.145; B.hombro.add(brazo);

    B.codo = new THREE.Group(); B.codo.position.y = -0.29; B.codo.rotation.order = 'YXZ'; B.hombro.add(B.codo);
    B.codo.add(esfera(0.045, M.casaca));
    const antebrazo = malla(new THREE.CylinderGeometry(0.044, 0.037, 0.25, 24), M.casaca); antebrazo.position.y = -0.125; B.codo.add(antebrazo);
    const puno = malla(new THREE.CylinderGeometry(0.046, 0.043, 0.075, 32), AP.ropa.bordado ? M.bordadoPuno : M.casaca); puno.position.y = -0.21; B.codo.add(puno);
    B.muneca = new THREE.Group(); B.muneca.position.y = -0.25; B.codo.add(B.muneca);
    const palma = esfera(1, M.manos, 0.015, 0.044, 0.039); palma.position.y = -0.042; B.muneca.add(palma);
    B.dedos = [];
    const largos = [0.025, 0.03, 0.028, 0.022];
    [0.027, 0.009, -0.009, -0.025].forEach((z, i) => {
      const d = new THREE.Group(); d.position.set(0, -0.079, z); B.muneca.add(d);
      const f1 = capsula(0.0086, largos[i], M.manos); f1.position.y = -largos[i]/2 - 0.004; d.add(f1);
      const d2 = new THREE.Group(); d2.position.y = -largos[i] - 0.009; d.add(d2);
      const f2 = capsula(0.0078, largos[i]*0.8, M.manos); f2.position.y = -largos[i]*0.4 - 0.004; d2.add(f2);
      if (MELERO){ const g = malla(new THREE.ConeGeometry(0.0072, i === 1 || i === 2 ? 0.05 : 0.034, 10), M.garra); g.position.set(0.004, -largos[i]*0.8 - 0.026, 0); g.rotation.set(0, 0, Math.PI + 0.35); d2.add(g); }
      B.dedos.push([d, d2]);
    });
    B.pulgar = new THREE.Group(); B.pulgar.position.set(s*0.006, -0.03, 0.034); B.muneca.add(B.pulgar);
    const p1 = capsula(0.0092, 0.026, M.manos); p1.position.y = -0.017; B.pulgar.add(p1);
    return B;
  }
  R.brazoD = crearBrazo(-1); // sostiene el objeto, si lo hay
  R.brazoI = crearBrazo(1);  // acompaña la palabra
  R.cuerpo = cuerpo;
  if (MELERO){ // cola larga de tamanduá
    const curva = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0.98, -0.13), new THREE.Vector3(0.03, 0.78, -0.3), new THREE.Vector3(0.08, 0.5, -0.42), new THREE.Vector3(0.16, 0.25, -0.5), new THREE.Vector3(0.3, 0.12, -0.52)]);
    const mat = new THREE.MeshPhysicalMaterial({ color:C3(AP.piel), roughness:0.75, sheen:0.6, sheenColor:new THREE.Color(0xfff0d8) });
    const matO = new THREE.MeshPhysicalMaterial({ color:0x6a5644, roughness:0.75 });
    for (let i = 0; i <= 60; i++){ const t = i/60, p = curva.getPoint(t); const e = esfera(0.052*(1 - t*0.72), t > 0.55 && Math.floor(i/5) % 2 === 0 ? matO : mat, 1, 1, 1, 14); e.position.copy(p); cuerpo.add(e); }
  }

  if (AP.objeto.tipo === 'bandera'){
  /* Asta y bandera */
  const asta = new THREE.Group(); R.asta = asta;
  const LARGO = 1.45, AGARRE = 0.16;
  const palo = malla(new THREE.CylinderGeometry(0.017, 0.019, LARGO, 20), M.madera); palo.position.y = LARGO/2 - AGARRE; asta.add(palo);
  const remate = esfera(0.022, M.oro); remate.position.y = LARGO - AGARRE + 0.01; asta.add(remate);
  const giro = new THREE.Group(); giro.position.y = LARGO - AGARRE - 0.02; asta.add(giro); R.giroBandera = giro;
  const W = 0.95, H = 0.68;
  const bandera = crearTela(W, H, 44, 30, M.bandera, (x, y, z, t) => {
    const u = (x + W/2)/W, vv = (H/2 - y)/H;
    const ola = 0.075*Math.sin(u*6 - t*2.0 + vv*1.6) + 0.025*Math.sin(u*13 - t*3.2 + vv*3) + 0.02*Math.sin(vv*9 + t*1.3)*u;

  bandera.castShadow = true; giro.add(bandera);
  R.bandera = bandera;
  }

  raiz.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return { raiz, R };
}

/* ---------------- Ave ----------------
   Cuerpo de ave paramétrico, posado en una rama: abre el pico al hablar,
   mueve la cabeza a saltitos, agita las alas y la cola. */
function pintarVertices(geo, fn){
  const p = geo.attributes.position, c = new THREE.Color(), d = new THREE.Vector3(), cols = [];
  for (let i = 0; i < p.count; i++){ d.fromBufferAttribute(p, i).normalize(); fn(d, c); cols.push(c.r, c.g, c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
}
function crearAveFigura(){
  const A = AP.ave, K = A.colores, raiz = new THREE.Group(), R = { ave:true };

  for (const [x, a] of [[0.35, 0.7], [-0.45, -0.6]]){ const r = malla(new THREE.CylinderGeometry(0.008/esc, 0.016/esc, 0.3/esc, 8), M.ramita); r.position.set(x/esc, 0.06/esc, -0.02); r.rotation.z = a; ave.add(r); }
  const cLomo = C3(K.lomo), cPecho = C3(K.pecho), cCab = C3(K.cabeza), cGar = C3(K.garganta), negro = C3('#151515'), blanco = C3('#f2f0ea');
  // Cuerpo
  const torso = new THREE.Group(); torso.position.set(0, yCuerpo, 0); torso.rotation.x = -0.18; ave.add(torso); R.torsoAve = torso;
  const gCuerpo = new THREE.SphereGeometry(1, 48, 36);
  pintarVertices(gCuerpo, (d, c) => {
    const vientre = sstep(-0.15, 0.45, d.z)*sstep(0.55, -0.1, d.y);
    c.copy(cLomo).lerp(cPecho, vientre);
    if (A.garganta) c.lerp(cGar, sstep(0.3, 0.7, d.z)*sstep(0.35, 0.75, d.y));
    c.multiplyScalar(0.95 + 0.1*ruido3(d.x*12, d.y*12, d.z*12));
  });
  const cuerpoM = malla(gCuerpo, plumaje()); cuerpoM.scale.set(0.16, 0.21, 0.185); torso.add(cuerpoM);
  // Alas
  R.alas = [];
  for (const s of [-1, 1]){
    const pivote = new THREE.Group(); pivote.position.set(s*0.118, 0.1, -0.035); torso.add(pivote);
    const g = new THREE.SphereGeometry(1, 32, 24);
    pintarVertices(g, (d, c) => { c.copy(cLomo).multiplyScalar(0.85).lerp(cLomo.clone().multiplyScalar(0.35), sstep(-0.1, -0.9, d.y)); });
    const ala = malla(g, plumaje()); ala.scale.set(0.045, 0.17, 0.125); ala.position.set(s*0.0, -0.1, -0.03); ala.rotation.set(-0.3, s*0.18, s*0.04); pivote.add(ala);

    c.multiplyScalar(0.96 + 0.08*ruido3(d.x*14, d.y*14, d.z*14));
  });
  const cabM = malla(gCab, plumaje()); cabM.scale.set(0.1, 0.094, 0.105); cab.add(cabM);
  // Ojos a los costados
  R.ojosAve = [];

    const aro = malla(new THREE.SphereGeometry(0.019, 20, 14), matIris); aro.scale.z = 0.55; o.add(aro);
    const pup = malla(new THREE.SphereGeometry(0.0125, 18, 12), new THREE.MeshPhysicalMaterial({ color:0x050505, roughness:0.05, clearcoat:1 })); pup.position.z = 0.006; pup.scale.z = 0.6; o.add(pup);
    const brillo = esfera(0.0035, M.camisa); brillo.position.set(0.004, 0.005, 0.0135); o.add(brillo);

  // Pico: mitad superior fija y mitad inferior articulada

  const forma = A.formaPico || 'fino', lp = A.largoPico ?? 1;

  const [rp, lpico, ap] = dims;
  const pico = new THREE.Group(); pico.position.set(0, -0.012, 0.095); pico.scale.setScalar(1.35); cab.add(pico);
  const sup = malla(new THREE.ConeGeometry(rp, lpico, 18), matPico); sup.rotation.x = Math.PI/2; sup.position.set(0, 0.004, lpico/2); sup.scale.set(1, 1, 0.6*ap); pico.add(sup);
  if (forma === 'ganchudo'){ const gancho = malla(new THREE.ConeGeometry(rp*0.45, 0.035, 12), matPico); gancho.position.set(0, -0.012, lpico*0.92); gancho.rotation.x = Math.PI*0.92; pico.add(gancho); }
  const bisagra = new THREE.Group(); bisagra.position.set(0, -0.004, 0); pico.add(bisagra); R.picoInf = bisagra;
  const inf = malla(new THREE.ConeGeometry(rp*0.85, lpico*(forma === 'ganchudo' ? 0.55 : 0.9), 18), matPico);

  }
  raiz.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return { raiz, R };
}
const avePose = { yaw:0.6, pitch:0, tilt:0.12, objYaw:0.6, objTilt:0.12, prox:1.5, parpadeo:2, lado:1 };
function animarAve(t, dt, hablando, escuchando){
  const A = avePose;
  R.picoInf.rotation.x = clamp(voz.abrir*0.55 + voz.ancho*0.15 + voz.redondo*0.3, 0, 0.6);
  // a dónde mira: a quien la observa, con giros bruscos de pájaro
  R.cabezaAve.getWorldPosition(vTmp);
  const dx = camera.position.x - vTmp.x, dz = camera.position.z - vTmp.z;
  let rel = Math.atan2(dx, dz) - figura.raiz.rotation.y; rel = Math.atan2(Math.sin(rel), Math.cos(rel));
  const alcanza = 1 - sstep(1.9, 2.6, Math.abs(rel));
  A.prox -= dt;
  if (A.prox <= 0){
    if (Math.random() < 0.35) A.lado = -A.lado;   // los pájaros miran con un ojo: cambia de lado de vez en cuando
    A.objYaw = A.lado*(0.55 + Math.random()*0.25) + (hablando || escuchando ? 0 : (Math.random() - 0.5)*0.6); A.objTilt = (Math.random() - 0.5)*(escuchando ? 0.7 : 0.45);
    A.prox = 0.5 + Math.random()*(hablando ? 1.2 : 2.2);
  }
  A.yaw = suave(A.yaw, clamp(clamp(rel, -1.0, 1.0)*alcanza + A.objYaw, -1.5, 1.5), 12, dt);
  A.tilt = suave(A.tilt, A.objTilt, 14, dt);
  const cabeceo = hablando ? 0.09*Math.sin(t*7.5)*voz.energia : 0;
  R.cabezaAve.rotation.set((-0.05 + cabeceo - voz.pico*0.15)*AMP, A.yaw, A.tilt*AMP);
  // respiración, alas y cola
  const resp = Math.sin(t*2.4);
  R.torsoAve.scale.set(1 + 0.012*resp, 1 + 0.008*resp, 1 + 0.012*resp);
  const aleteo = (hablando ? voz.pico*0.6 + voz.energia*0.08 : 0)*AMP;
  R.alas.forEach((al, i) => { const s = i ? 1 : -1; al.rotation.z = s*(0.04 + aleteo*(0.6 + 0.4*Math.sin(t*20))); al.rotation.x = -aleteo*0.3; });
  R.cola.rotation.x = 0.55 + (0.06*Math.sin(t*1.3) + (hablando ? 0.12*Math.sin(t*5.2)*voz.energia : 0))*AMP;
  // parpadeo
  A.parpadeo -= dt; let cierre = 0;
  if (A.parpadeo < 0){ cierre = Math.sin(Math.min(1, -A.parpadeo/0.14)*Math.PI); if (A.parpadeo < -0.14) A.parpadeo = 2 + Math.random()*3.5; }
  R.ojosAve.forEach(o => o.scale.y = 1 - 0.85*cierre);
}

/* ---------------- Aguará guazú ----------------
   Cánido de patas largas y finas, pelaje rojizo, crin negra en la nuca y el lomo,
   orejas grandes y hocico fino. Mueve la mandíbula con la voz, gira el cuello hacia
   quien lo mira, mueve las orejas y la cola, parpadea y respira.
   Es tímido: cuando nadie le habla aparta la mirada y baja un poco la cabeza. */
const AG_BASE = { tamano:1, timidez:0.7, suelo:'#6d6a3a',
  colores:{ pelaje:'#c4561e', claro:'#e6ad70', melena:'#15100d', patas:'#1d1713', blanco:'#f4ede1', nariz:'#100d0c', ojo:'#7a4414' } };
function crearAguaraFigura(){
  const A = fusionar(AG_BASE, AP.aguara || {}), K = A.colores, raiz = new THREE.Group(), R = { aguara:true, orejas:[], ojos:[], timidez:A.timidez };
  const cRojo = C3(K.pelaje), cClaro = C3(K.claro), cNegro = C3(K.melena), cPata = C3(K.patas), cBlanco = C3(K.blanco);
  const rnd = azar(29), Y = new THREE.Vector3(0, 1, 0);

  const matMelena = new THREE.MeshPhysicalMaterial({ color:cNegro, roughness:0.75, sheen:0.8, sheenColor:new THREE.Color(0x4a3a2e), sheenRoughness:0.4, envMapIntensity:0.3 });
  const animal = new THREE.Group(); animal.scale.setScalar(A.tamano || 1); raiz.add(animal); R.animal = animal;

  // Suelo de pastizal: un parche con borde suave y pastos de distintas alturas
  {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    const g = x.createRadialGradient(128, 128, 8, 128, 128, 128); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, '#000'); x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    const suelo = new THREE.Mesh(new THREE.CircleGeometry(3.4, 64), new THREE.MeshStandardMaterial({ color:C3(A.suelo), roughness:1, alphaMap:new THREE.CanvasTexture(c), transparent:true, depthWrite:false }));
    suelo.rotation.x = -Math.PI/2; suelo.position.y = 0.001; suelo.receiveShadow = true; if (!window.__esc) raiz.add(suelo);
    const hoja = new THREE.ConeGeometry(0.014, 1, 3, 1); hoja.translate(0, 0.5, 0);
    const N = 560, hierba = new THREE.InstancedMesh(hoja, new THREE.MeshStandardMaterial({ roughness:0.9, side:THREE.DoubleSide }), N), d = new THREE.Object3D(), col = new THREE.Color();
    const verdes = ['#5f7a34', '#7d8a3e', '#98984c', '#4d6a2c', '#a8a25c'];
    for (let i = 0; i < N; i++){
      const a = rnd()*Math.PI*2, r = 0.3 + Math.pow(rnd(), 0.7)*2.9;
      const alto = r < 0.9 ? 0.07 + rnd()*0.13 : 0.14 + rnd()*0.3 + Math.max(0, r - 1.6)*0.4*rnd();
      d.position.set(Math.cos(a)*r, 0, Math.sin(a)*r); d.rotation.set((rnd() - 0.5)*0.4, rnd()*6, (rnd() - 0.5)*0.4); d.scale.set(1 + rnd()*0.6, alto, 1 + rnd()*0.6); d.updateMatrix();
      hierba.setMatrixAt(i, d.matrix); hierba.setColorAt(i, col.set(verdes[Math.floor(rnd()*verdes.length)]).multiplyScalar(0.8 + rnd()*0.4));
    }
    hierba.instanceColor.needsUpdate = true; hierba.receiveShadow = true; if (!window.__esc) raiz.add(hierba);
  }

  // Ayudas de modelado
  const rui = (d, f = 12) => 0.95 + 0.1*ruido3(d.x*f, d.y*f, d.z*f);
  const ell = (padre, c, r, color, mat = matPelo, seg = 36) => {
    const g = new THREE.SphereGeometry(1, seg, Math.round(seg*0.75)); if (color) pintarVertices(g, color);
    const m = malla(g, mat); m.scale.set(r[0], r[1], r[2]); m.position.set(c[0], c[1], c[2]); padre.add(m); return m;
  };
  const colorear = (g, fn) => { const p = g.attributes.position, c = new THREE.Color(), cols = []; for (let i = 0; i < p.count; i++){ fn(p.getX(i), p.getY(i), p.getZ(i), c); cols.push(c.r, c.g, c.b); } g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); };
  const tramo = (padre, p0, p1, r0, r1, color, seg = 14) => {
    const a = new THREE.Vector3(...p0), b = new THREE.Vector3(...p1), L = a.distanceTo(b);
    const g = new THREE.CylinderGeometry(r1, r0, L, seg, 6);
    colorear(g, (x, y, z, c) => color(y/L + 0.5, c, x, z));
    const m = malla(g, matPelo); m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(Y, b.sub(a).normalize()); padre.add(m); return m;

  const mechon = (padre, base, dir, h, r) => {
    const m = malla(new THREE.ConeGeometry(r, h, 7, 1), matMelena), d = new THREE.Vector3(...dir).normalize();
    m.quaternion.setFromUnitVectors(Y, d); m.position.set(...base).addScaledVector(d, h/2); padre.add(m); return m;
  };
  const colorTorso = (d, c) => { c.copy(cRojo).lerp(cClaro, sstep(0.05, -0.75, d.y)*0.9); c.multiplyScalar(rui(d)); };
  const colPata = (y0, y1) => (t, c) => { const y = y0 + (y1 - y0)*t; c.copy(cRojo).lerp(cClaro, 0.25); c.lerp(cPata, sstep(0.52, 0.34, y)); c.multiplyScalar(0.96 + 0.08*ruido3(t*9, y*20, 1.3)); };
  const colPie = (d, c) => c.copy(cPata).multiplyScalar(rui(d, 20));

  // Tronco (respira): pecho angosto y profundo, lomo largo, grupa fina
  const torso = new THREE.Group(); torso.position.set(0, 0.8, 0); animal.add(torso); R.torso = torso;
  ell(torso, [0, -0.01, 0.2], [0.105, 0.155, 0.19], colorTorso);

  // Crin negra sobre el lomo, hasta la mitad del cuerpo

    for (const x of [-0.013, 0.013]) mechon(torso, [x + (rnd() - 0.5)*0.01, 0.12, z], [0, 1, -0.55 - 0.25*u], h*(0.9 + rnd()*0.25), 0.017);
  }

  // Patas largas y finas: negras desde la mitad hacia abajo
  for (const s of [-1, 1]){
    const h = [s*0.078, 0.74, 0.225], m = [s*0.072, 0.4, 0.235], w = [s*0.066, 0.1, 0.248], p = [s*0.066, 0.025, 0.262];
    ell(animal, [s*0.085, 0.72, 0.21], [0.052, 0.11, 0.09], colorTorso);
    tramo(animal, h, m, 0.05, 0.03, colPata(0.74, 0.4));
    ell(animal, m, [0.031, 0.031, 0.031], (d, c) => colPata(0.4, 0.4)(0, c));
    tramo(animal, m, w, 0.03, 0.02, colPata(0.4, 0.1));
    ell(animal, w, [0.021, 0.021, 0.021], colPie);
    tramo(animal, w, p, 0.02, 0.022, colPata(0.1, 0.025));

  }
  for (const s of [-1, 1]){
    const cad = [s*0.085, 0.76, -0.3], rod = [s*0.08, 0.47, -0.19], jar = [s*0.072, 0.27, -0.36], pie = [s*0.07, 0.03, -0.32];
    ell(animal, [s*0.09, 0.69, -0.27], [0.062, 0.13, 0.115], colorTorso);
    tramo(animal, cad, rod, 0.055, 0.032, colPata(0.76, 0.47));
    ell(animal, rod, [0.034, 0.034, 0.034], (d, c) => colPata(0.47, 0.47)(0, c));
    tramo(animal, rod, jar, 0.034, 0.02, colPata(0.47, 0.27));
    ell(animal, jar, [0.022, 0.022, 0.022], colPie);
    tramo(animal, jar, pie, 0.02, 0.022, colPata(0.27, 0.03));
    ell(animal, [s*0.07, 0.018, -0.3], [0.03, 0.02, 0.052], colPie);
  }

  // Cola corta y tupida, con la punta clara
  const cola = new THREE.Group(); cola.position.set(0, 0.84, -0.45); animal.add(cola); R.cola = cola;
  tramo(cola, [0, 0, 0], [0, -0.07, -0.09], 0.036, 0.042, (t, c) => c.copy(cRojo));
  { const e = ell(cola, [0, -0.15, -0.14], [0.05, 0.12, 0.056], (d, c) => { c.copy(cRojo).lerp(cClaro, 0.2).lerp(cBlanco, sstep(-0.1, -0.95, d.y)*0.75).multiplyScalar(rui(d, 14)); }); e.rotation.x = 0.56; }

  // Cuello largo con la crin erizada y la garganta clara
  const cuello = new THREE.Group(); cuello.position.set(0, 0.89, 0.3); cuello.rotation.order = 'YXZ'; animal.add(cuello); R.cuello = cuello;
  const pN = [0, 0.289, 0.177];
  ell(cuello, [0, 0, 0], [0.085, 0.09, 0.09], colorTorso);
  tramo(cuello, [0, -0.02, -0.01], pN, 0.078, 0.05, (t, c, x, z) => {
    const r = 0.078 - 0.028*t; c.copy(cRojo).lerp(cClaro, 0.25); c.lerp(cBlanco, sstep(0.15, 0.75, z/r)*sstep(0, 0.25, t)); c.multiplyScalar(0.96 + 0.08*ruido3(x*30, t*10, z*30));
  }, 18);
  const dN = new THREE.Vector3(...pN).normalize(), nB = new THREE.Vector3(0, dN.z, -dN.y);   // nB: hacia arriba y atrás
  for (let i = 0; i < 15; i++){
    const u = i/14, r = 0.074 - 0.026*u, base = dN.clone().multiplyScalar(0.34*u).addScaledVector(nB, r*0.85), dir = nB.clone().addScaledVector(dN, -0.4 + 0.5*u);
    for (const x of [-0.014, 0.014]) mechon(cuello, [x, base.y, base.z], [dir.x, dir.y, dir.z], (0.115 - 0.05*u)*(0.9 + rnd()*0.25), 0.018);
  }
  for (let i = 0; i < 12; i++){
    const u = i/11, r = 0.07 - 0.024*u, base = dN.clone().multiplyScalar(0.3*u + 0.02).addScaledVector(nB, r*0.45);
    for (const s of [-1, 1]) mechon(cuello, [s*r*0.85, base.y, base.z], [s*0.9, nB.y*0.4 + 0.3, nB.z*0.4 - 0.1], (0.06 - 0.02*u)*(0.9 + rnd()*0.25), 0.014);
  }

  // Cabeza: cráneo, hocico fino, mandíbula articulada, orejas grandes
  const cabeza = new THREE.Group(); cabeza.position.set(...pN); cabeza.rotation.order = 'YXZ'; cabeza.rotation.x = 0.36; cuello.add(cabeza); R.cabeza = cabeza;
  ell(cabeza, [0, 0.025, 0.035], [0.058, 0.056, 0.078], (d, c) => { c.copy(cRojo).lerp(cClaro, sstep(0, -0.7, d.y)*0.8 + sstep(0.5, 1, d.z)*0.35); c.multiplyScalar(rui(d, 14)); });
  const hocico = (z, y, r, lerpNariz) => ell(cabeza, [0, y, z], r, (d, c) => { c.copy(cClaro).lerp(cRojo, sstep(0.2, 0.9, d.y)*0.75); if (lerpNariz) c.lerp(cNegro, sstep(0.3, 1, d.z)*0.55); c.multiplyScalar(rui(d, 16)); });
  hocico(0.11, -0.005, [0.04, 0.037, 0.065], false);
  hocico(0.165, -0.014, [0.029, 0.027, 0.05], false);
  hocico(0.21, -0.02, [0.02, 0.019, 0.04], true);
  ell(cabeza, [0, -0.017, 0.248], [0.021, 0.016, 0.017], null, M.narizM);
  ell(cabeza, [0, -0.04, 0.12], [0.024, 0.006, 0.07], null, M.boca, 16);
  const mand = new THREE.Group(); mand.position.set(0, -0.035, 0.04); cabeza.add(mand); R.mand = mand;
  const barbilla = (d, c) => { c.copy(cBlanco).lerp(cClaro, sstep(0.2, 0.9, d.y)*0.7).multiplyScalar(rui(d, 16)); };
  ell(mand, [0, -0.003, 0.075], [0.029, 0.018, 0.06], barbilla);
  ell(mand, [0, -0.006, 0.13], [0.019, 0.013, 0.045], barbilla);
  ell(mand, [0, 0.008, 0.08], [0.021, 0.007, 0.062], null, M.boca, 16);
  ell(mand, [0, 0.005, 0.088], [0.012, 0.006, 0.042], null, M.lengua, 16);
  const matIris = new THREE.MeshPhysicalMaterial({ color:C3(K.ojo), roughness:0.2, clearcoat:1 });
  for (const s of [-1, 1]){

    const oreja = new THREE.Group(); oreja.position.set(s*0.038, 0.062, -0.02); oreja.userData.s = s; oreja.rotation.set(-0.15, 0, -s*0.3); cabeza.add(oreja); R.orejas.push(oreja);
    const gO = new THREE.ConeGeometry(0.052, 0.2, 16, 1); gO.translate(0, 0.1, 0);

    const oM = malla(gO, matPelo); oM.scale.z = 0.32; oreja.add(oM);
    const gI = new THREE.ConeGeometry(0.036, 0.16, 14, 1); gI.translate(0, 0.085, 0);
    colorear(gI, (x, y, z, c) => c.copy(cBlanco).lerp(cClaro, sstep(0.06, 0.0, y)*0.5));
    const iM = malla(gI, matPelo); iM.scale.z = 0.3; iM.position.z = 0.012; oreja.add(iM);

    const o = new THREE.Group(); o.position.copy(pos); o.lookAt(pos.clone().multiplyScalar(3)); cabeza.add(o); R.ojos.push(o);
    const marco = malla(new THREE.SphereGeometry(0.0185, 20, 14), matMelena); marco.scale.set(1, 0.85, 0.45); marco.position.z = -0.003; o.add(marco);
    const iris = malla(new THREE.SphereGeometry(0.0125, 20, 14), matIris); iris.scale.z = 0.6; iris.position.z = 0.002; o.add(iris);
    const pup = malla(new THREE.SphereGeometry(0.0075, 16, 12), new THREE.MeshPhysicalMaterial({ color:0x050505, roughness:0.05, clearcoat:1 })); pup.position.z = 0.007; pup.scale.z = 0.6; o.add(pup);
    const brillo = esfera(0.0028, M.camisa); brillo.position.set(0.0035, 0.0045, 0.0105); o.add(brillo);
  }
  return { raiz, R };
}
const agPose = { yaw:0.5, pitch:0, objYaw:0.5, objPitch:0.1, prox:1.2, parpadeo:2.4, orejaT:[1.2, 2.6], orejaImp:[0, 0] };
function animarAguara(t, dt, hablando, escuchando){
  const A = agPose, G = R;
  // mandíbula: sigue las vocales; con M, B y P se cierra
  G.mand.rotation.x = clamp(voz.abrir*0.5 + voz.redondo*0.28 + voz.ancho*0.14, 0, 0.62)*(1 - 0.6*voz.cerrar);
  // a quién mira
  G.cuello.getWorldPosition(vTmp);
  const dx = camera.position.x - vTmp.x, dz = camera.position.z - vTmp.z, dy = camera.position.y - vTmp.y;
  let rel = Math.atan2(dx, dz) - figura.raiz.rotation.y; rel = Math.atan2(Math.sin(rel), Math.cos(rel));
  const alcanza = 1 - sstep(1.6, 2.4, Math.abs(rel));
  const teSigue = performance.now() - vista.ultimaInteraccion < 2600;
  const conversa = hablando || escuchando || teSigue;
  A.prox -= dt;
  if (A.prox <= 0){   // tímido: de vez en cuando aparta la mirada y baja la cabeza, y vuelve
    const aparta = conversa ? Math.random() < 0.22*G.timidez : Math.random() < 0.7;
    const lado = Math.random() < 0.5 ? -1 : 1;
    A.objYaw = aparta ? lado*(0.35 + Math.random()*0.35) : (Math.random() - 0.5)*0.12;
    A.objPitch = aparta ? 0.12 + Math.random()*0.12 : (Math.random() - 0.5)*0.08 - (escuchando ? 0.05 : 0);
    A.prox = aparta ? 0.9 + Math.random()*1.2 : 1.6 + Math.random()*2.4;
  }
  const meta = clamp(rel*alcanza*(conversa ? 1 : 0.5), -1.15, 1.15) + A.objYaw;
  A.yaw = suave(A.yaw, clamp(meta, -1.3, 1.3), 4.5, dt);
  const subeCam = clamp(Math.atan2(dy, Math.hypot(dx, dz)), -0.4, 0.4)*alcanza*(conversa ? 1 : 0.3);
  A.pitch = suave(A.pitch, A.objPitch - subeCam*0.6, 5, dt);
  const cabeceo = hablando ? 0.05*Math.sin(t*6.5)*voz.energia + voz.pico*0.1 : 0;
  G.cuello.rotation.set(A.pitch*0.5*AMP, A.yaw*0.7, 0);
  G.cabeza.rotation.set(0.36 + A.pitch*0.5*AMP + cabeceo*AMP, A.yaw*0.3, (escuchando ? 0.12 : 0.02*Math.sin(t*0.6))*AMP);
  // orejas: se mueven solas, se paran al escuchar
  G.orejas.forEach((o, i) => {
    A.orejaT[i] -= dt; if (A.orejaT[i] <= 0){ A.orejaImp[i] = 1; A.orejaT[i] = 1.5 + Math.random()*4; }
    A.orejaImp[i] = Math.max(0, A.orejaImp[i] - dt*3);
    const flick = Math.sin(Math.min(1, A.orejaImp[i])*Math.PI)*AMP, s = o.userData.s;
    o.rotation.set(-0.15 + (escuchando ? 0.22 : 0) - flick*0.22 + (hablando ? 0.05*Math.sin(t*5 + i)*voz.energia : 0), 0, -s*(0.3 - (escuchando ? 0.1 : 0) + flick*0.16));
  });
  // cola, respiración y un leve balanceo del cuerpo
  G.cola.rotation.set((0.05*Math.sin(t*1.1) + (hablando ? 0.08*Math.sin(t*4)*voz.energia : 0))*AMP, 0, 0.14*Math.sin(t*0.8)*AMP);
  const resp = Math.sin(t*1.9);
  G.torso.scale.set(1 + 0.012*resp, 1 + 0.01*resp, 1);
  G.animal.rotation.y = 0.018*Math.sin(t*0.4)*AMP;
  // parpadeo
  A.parpadeo -= dt; let cierre = 0;
  if (A.parpadeo < 0){ cierre = Math.sin(Math.min(1, -A.parpadeo/0.16)*Math.PI); if (A.parpadeo < -0.16) A.parpadeo = 2 + Math.random()*3.5; }
  G.ojos.forEach(o => o.scale.y = 1 - 0.85*cierre);
}


const figura = AGUARA ? crearAguaraFigura() : AVE ? crearAveFigura() : crearPersona();
figura.raiz.rotation.y = AGUARA ? 0.85 : -0.2; // cuerpo de tres cuartos

  const r = azar(21);
  for (let i = 0; i < 26; i++){
    const x = r()*512, y = 40 + r()*176, w = 20 + r()*70, hh = 14 + r()*50;
    ctx.fillStyle = r() < 0.5 ? '#7a9a4a' : '#a88a52'; ctx.beginPath(); ctx.ellipse(x, y, w, hh, r()*3, 0, Math.PI*2); ctx.fill();
  }

}

      };

function aplicarPose(B, P, beat){
  const s = B.s;
  B.hombro.rotation.set(P.hx - beat*0.07, 0, s*P.hz);
  B.codo.rotation.set(P.cx - beat*0.14, s*P.cy, 0);
  if (!B.munecaFija) B.muneca.rotation.set(P.mx + beat*0.18, -s*P.my, s*P.mz);
  B.dedos.forEach(([d1, d2], i) => { const c = i === 0 ? P.indice : P.curva + i*0.04; d1.rotation.z = -s*c; d2.rotation.z = -s*c*0.95; });
  B.pulgar.rotation.set(-0.7, 0, -s*(P.curva > 1 ? 0.75 : 0.3 - P.curva*0.2));
}

// La mano derecha toma el asta: se orienta la muñeca para que el puño abrace el palo
function montarAsta(){
  const B = R.brazoD;
  aplicarPose(B, ASTA, 0);
  figura.raiz.updateMatrixWorld(true);
  const dirAsta = new THREE.Vector3(0.62, 1, -0.12).normalize();
  const qMano = new THREE.Quaternion(); B.muneca.getWorldQuaternion(qMano);
  const zMano = new THREE.Vector3(0, 0, 1).applyQuaternion(qMano);
  const qManoNueva = new THREE.Quaternion().setFromUnitVectors(zMano, dirAsta).multiply(qMano);
  const qPadre = new THREE.Quaternion(); B.codo.getWorldQuaternion(qPadre);
  B.muneca.quaternion.copy(qPadre.invert().multiply(qManoNueva));
  B.munecaFija = true;
  // el palo (eje y) coincide con el eje z de la mano y pasa por el puño
  R.asta.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI/2);
  R.asta.position.set(-B.s*0.019, -0.062, 0);
  B.muneca.add(R.asta);
  figura.raiz.updateMatrixWorld(true);
  // la bandera cae hacia la derecha y atrás
  const qAsta = new THREE.Quaternion(); R.asta.getWorldQuaternion(qAsta);
  const d = new THREE.Vector3(0, 1, 0).applyQuaternion(qAsta);
  const xw = new THREE.Vector3(1, 0, 0).applyQuaternion(qAsta);
  const deseada = new THREE.Vector3(1, -0.1, -0.7); deseada.sub(d.clone().multiplyScalar(deseada.dot(d))).normalize();
  R.giroBandera.rotation.y = Math.atan2(deseada.dot(new THREE.Vector3().crossVectors(d, xw)), deseada.dot(xw));
}
// Lleva la muñeca de un brazo hasta un punto: descenso por coordenadas sobre los cuatro ángulos de la pose
function alcanzar(B, objetivo, inicial){
  const P = { ...inicial }, pos = new THREE.Vector3(), claves = ['hx', 'hz', 'cx', 'cy'];
  const error = () => { aplicarPose(B, P, 0); figura.raiz.updateMatrixWorld(true); B.muneca.getWorldPosition(pos); return pos.distanceTo(objetivo); };
  let e = error(), paso = 0.25;
  for (let it = 0; it < 120 && paso > 0.003; it++){
    let mejoro = false;
    for (const k of claves) for (const d of [paso, -paso]){ P[k] += d; const e2 = error(); if (e2 < e){ e = e2; mejoro = true; break; } P[k] -= d; }
    if (!mejoro) paso *= 0.5;
  }
  aplicarPose(B, P, 0);
  return P;
}
// Monta en la mano derecha cualquier objeto del catálogo
function montarEnPuno(obj, pose, dir){
  const B = R.brazoD;
  aplicarPose(B, pose, 0);
  figura.raiz.updateMatrixWorld(true);
  const d = new THREE.Vector3(...dir).normalize();
  const qMano = new THREE.Quaternion(); B.muneca.getWorldQuaternion(qMano);
  const zMano = new THREE.Vector3(0, 0, 1).applyQuaternion(qMano);
  const qNueva = new THREE.Quaternion().setFromUnitVectors(zMano, d).multiply(qMano);
  const qPadre = new THREE.Quaternion(); B.codo.getWorldQuaternion(qPadre);
  B.muneca.quaternion.copy(qPadre.invert().multiply(qNueva));
  B.munecaFija = true;
  obj.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI/2);
  obj.position.set(-B.s*0.019, -0.062, 0);
  B.muneca.add(obj);
}
function montarEnPalma(obj, pose, inclinar){
  const B = R.brazoD;
  aplicarPose(B, pose, 0); B.munecaFija = true;
  figura.raiz.updateMatrixWorld(true);
  const p = new THREE.Vector3(0, -0.06, 0); B.muneca.localToWorld(p); p.y += 0.022;
  const qDeseada = new THREE.Quaternion().setFromEuler(new THREE.Euler(-inclinar*0.5, figura.raiz.rotation.y + 0.35, 0));
  const qMun = new THREE.Quaternion(); B.muneca.getWorldQuaternion(qMun);
  obj.position.copy(B.muneca.worldToLocal(p));
  obj.quaternion.copy(qMun.invert().multiply(qDeseada));
  B.muneca.add(obj);
}

async function intentarGLB(){ if (window.__esc) return;
  try { const r = await fetch(CONFIG.modelo, { method:'HEAD' }); if (!r.ok) return; } catch { return; }

    const gltf = await new GLTFLoader().loadAsync(CONFIG.modelo);

    obj.updateMatrixWorld(true);
    obj.position.y -= new THREE.Box3().setFromObject(obj).min.y;
    const huesos = {}, morfos = [];
    obj.traverse(o => {
      if (o.isMesh){ o.castShadow = o.receiveShadow = true; if (o.morphTargetDictionary) morfos.push(o); }
      if (o.isBone) for (const n of ['Head','Neck','Spine2','RightArm','RightForeArm','RightHand','LeftArm','LeftForeArm','LeftHand'])
        if (!huesos[n] && o.name.replace(/^mixamorig:?/, '').endsWith(n)) huesos[n] = o;

    const reposo = {}; for (const [n, b] of Object.entries(huesos)) reposo[n] = b.quaternion.clone();
    const buscar = claves => { for (const m of morfos) for (const k of claves) if (k in m.morphTargetDictionary) return k; return null; };
    glb = { obj, huesos, reposo, morfos, clave:{
      abrir: buscar(['jawOpen','mouthOpen','viseme_aa','MouthOpen','A']),
      ancho: buscar(['mouthStretchLeft','viseme_E','viseme_I','mouthSmile','E']),

    figura.raiz.visible = false; scene.add(obj);
  } catch (e){ console.warn('No se pudo cargar el GLB; se usa la figura procedural.', e); }
}

      onDisconnect: () => { window.__puente?.desc(); terminarUI(); },

      onModeChange: ({ mode }) => ponerModo(mode === 'speaking' ? 'speaking' : 'listening'),

      onAudioAlignment: (al) => { linea.pendiente = al; },
      onAudio: (b64) => { try { llegaAudio(b64); } catch {} },
      onInterruption: () => cortarLinea(),
      onMessage: (m) => { window.__puente?.msg(m); const quien = m.source || m.role, txt = m.message || m.text || ''; if (!txt) return; (quien === 'ai' || quien === 'agent') ? subtitular(txt) : subtitular(txt, 'Vos'); }
    });
  } catch (e){

}

/* ---------------- Sincronía de labios ----------------
   Dos fuentes que se combinan:
   1) La alineación letra por letra que manda ElevenLabs con cada trozo de audio
      (qué letra suena y cuándo). Da la FORMA de la boca según el fonema.
   2) El análisis del audio que efectivamente suena (energía y formantes).
      Da la AMPLITUD y corrige la forma cuando no llega alineación.
   La línea de tiempo se ancla al primer instante en que el analizador oye voz. */
const VISEMAS = { // abrir, ancho, redondo, cerrar
  a:[1,0.15,0,0], e:[0.5,0.75,0,0], i:[0.26,1,0,0], o:[0.6,0,0.85,0], u:[0.28,0,1,0], w:[0.25,0,0.9,0],
  m:[0,0,0,1], b:[0,0,0,1], p:[0,0,0,1], v:[0,0,0,1],
  f:[0.08,0.35,0,0.55], s:[0.14,0.55,0,0], z:[0.14,0.55,0,0], c:[0.16,0.5,0,0], x:[0.16,0.5,0,0], y:[0.2,0.6,0,0],
  j:[0.3,0.3,0,0], g:[0.3,0.25,0,0], k:[0.32,0.2,0,0], q:[0.3,0.1,0.3,0], l:[0.3,0.25,0,0], n:[0.22,0.25,0,0],
  d:[0.25,0.25,0,0], t:[0.22,0.3,0,0], r:[0.3,0.2,0,0], 'ñ':[0.22,0.3,0,0]
};
const SILENCIO = [0, 0, 0, 0.3];
function visemaDe(ch){
  if (!ch) return SILENCIO;
  const l = ch.toLowerCase();
  if (l === 'ñ') return VISEMAS['ñ'];
  const b = l.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (b === 'h') return null;                 // muda: toma la forma de la letra siguiente
  return VISEMAS[b] || (/\p{L}/u.test(b) ? [0.25, 0.2, 0, 0] : SILENCIO);
}

const linea = { tramos:[], fin:0, anclado:true, formato:'pcm_16000', pendiente:null, ultimaAlineacion:-9 };
const ahoraS = () => performance.now()/1000;
function duracionAudio(b64){
  const bytes = b64.length*3/4 - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);
  const [tipo, tasa] = String(linea.formato).split('_'); const r = +tasa || 16000;
  return tipo === 'ulaw' ? bytes/r : bytes/2/r;
}
function llegaAudio(b64){
  const ahora = ahoraS(), dur = duracionAudio(b64);
  if (ahora > linea.fin + 0.25){ linea.anclado = false; linea.fin = ahora + 0.05; }  // empieza una frase nueva
  const t0 = linea.fin; linea.fin = t0 + dur;
  const al = linea.pendiente; linea.pendiente = null;
  if (al && al.chars?.length){
    linea.tramos.push({ t0, dur, escala:1, chars:al.chars, ini:al.char_start_times_ms, dura:al.char_durations_ms });
    linea.ultimaAlineacion = ahora;
  }
  linea.tramos = linea.tramos.filter(T => T.t0 + T.dur > ahora - 1);
}
function cortarLinea(){ linea.tramos = []; linea.fin = 0; linea.pendiente = null; }
function anclar(ahora){ // el analizador acaba de oír voz: la línea arranca ahora
  const T = linea.tramos.find(T => T.t0 + T.dur > ahora - 0.5);
  if (T){ const d = ahora - 0.02 - T.t0; for (const X of linea.tramos) X.t0 += d; linea.fin += d; }
  linea.anclado = true;
}
function visemaTexto(t){
  for (const T of linea.tramos){
    const ms = (t - T.t0)*1000/T.escala;
    if (ms < 0 || ms > T.dur*1000/T.escala + 40) continue;
    let i = 0; while (i < T.ini.length - 1 && T.ini[i+1] <= ms) i++;

function leerVoz(t, dt){
  const ahora = ahoraS(), c = estado.conv;
  let forma = null, E = 0;
  const enDemo = performance.now() < estado.demoHasta;
  if (c && estado.modo === 'speaking'){
    const r = rasgosAudio(c, dt);
    if (r){ E = r.E; if (E > 0.12){ audio.ultimaVoz = ahora; if (!linea.anclado) anclar(ahora); } }
    const vt = visemaTexto(ahora + 0.03);
    const fa = r ? formaAudio(r) : null;
    if (vt && fa){
      forma = vt.forma.map((x, n) => x*0.75 + fa[n]*0.25);
      const cierra = sstep(0.5, 0.9, vt.forma[3]);   // M, B, P: los labios se juntan del todo aunque el audio siga sonando
      forma[0] *= 1 - 0.9*cierra; forma[3] = Math.max(forma[3], vt.forma[3]);

    const vt = visemaTexto(ahora + 0.02);
    if (vt){ forma = vt.forma; E = vt.letra ? 0.55 + 0.35*Math.abs(Math.sin(t*9)) : 0; }

  salida.ancho = clamp(forma[1]*gate, 0, 1);
  salida.redondo = clamp(forma[2]*gate, 0, 1);
  salida.cerrar = clamp(Math.max(forma[3]*gate, (1 - gate)*reciente*0.6), 0, 1);

}

/* Demostración sin conexión: dice la frase elegida en el Creador.
   Si el navegador tiene una voz en castellano, la usa y sincroniza la boca con cada palabra. */
const FRASE_DEMO = PERSONA.fraseDemo || `Hola, soy ${PERSONA.nombre}.`;
function elegirVozLocal(){
  const voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  const pref = [/es-AR/i, /es-(UY|CL|PY)/i, /es-(MX|US|419)/i, /es/i];
  const masc = /diego|jorge|juan|carlos|pablo|enrique|tom[aá]s|andr[eé]s|male|hombre/i;
  for (const p of pref){ const c = voces.filter(v => p.test(v.lang)); if (c.length) return c.find(v => masc.test(v.name)) || c[0]; }
  return null;
}
function demoHablar(){
  const chars = [...FRASE_DEMO], ini = [], dura = []; let ms = 0;
  for (const ch of chars){ const d = /[,.;:]/.test(ch) ? 280 : ch === ' ' ? 55 : /[aeiouáéíóú]/i.test(ch) ? 92 : 68; ini.push(ms); dura.push(d); ms += d; }
  const T = { t0:ahoraS() + 0.25, dur:ms/1000, escala:1, chars, ini, dura };
  linea.tramos = [T];
  estado.demoHasta = performance.now() + ms + 900;
  if (!estado.conv) ponerModo('speaking');
  const fin = () => { estado.demoHasta = Math.min(estado.demoHasta, performance.now() + 300); setTimeout(() => { if (!estado.conv && performance.now() >= estado.demoHasta) ponerModo('inactivo'); }, 400); };
  setTimeout(() => { if (!estado.conv && performance.now() >= estado.demoHasta) ponerModo('inactivo'); }, ms + 1000);
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(FRASE_DEMO);
    const v = elegirVozLocal(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'es-AR';
    u.rate = 0.95; u.pitch = 0.82;
    let previo = null;
    u.onstart = () => { T.t0 = ahoraS(); };
    u.onboundary = (e) => {
      if (e.name && e.name !== 'word') return;
      const i = Math.min(e.charIndex, ini.length - 1), ahora = ahoraS();
      if (previo && i > previo.i){ const real = (ahora - previo.t)*1000, est = ini[i] - ini[previo.i]; T.escala = clamp(T.escala*0.5 + clamp(real/est, 0.5, 2)*0.5, 0.5, 2); }
      T.t0 = ahora - ini[i]*T.escala/1000; T.dur = ms*T.escala/1000;
      estado.demoHasta = performance.now() + (ms - ini[i])*T.escala + 600;
      previo = { i, t:ahora };
    };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  } catch {}
}

  if (glb) animarGLB(t, cierre);
  actualizarVista(dt);
  renderer.render(scene, camera);
  if (!avisado){ avisado = true; try { parent.postMessage({ tipo:'motor-listo' }, '*'); } catch {} }
  requestAnimationFrame(animar);
}

const qTmp = new THREE.Quaternion(), eTmp = new THREE.Euler();
function rotarHueso(nombre, x, y, z){ const b = glb.huesos[nombre]; if (!b) return; eTmp.set(x, y, z); qTmp.setFromEuler(eTmp); b.quaternion.copy(glb.reposo[nombre]).multiply(qTmp); }
function animarGLB(t, cierre){
  const fijar = (clave, valor) => { if (!clave) return; for (const m of glb.morfos){ const i = m.morphTargetDictionary[clave]; if (i !== undefined) m.morphTargetInfluences[i] = valor; } };
  fijar(glb.clave.abrir, voz.abrir*0.9); fijar(glb.clave.ancho, voz.ancho*0.6); fijar(glb.clave.redondo, voz.redondo*0.7); fijar(glb.clave.cerrar, voz.cerrar*0.8);
  fijar(glb.clave.cejas, voz.pico); fijar(glb.clave.parpadoI, cierre); fijar(glb.clave.parpadoD, cierre);
  const b = CONFIG.glb.bajarBrazos, g = voz.gesto;
  rotarHueso('RightArm', -0.3, 0, b - 0.2); rotarHueso('RightForeArm', 0, 0, 0.9);
  rotarHueso('LeftArm', -g*0.5, 0, -b + g*0.35); rotarHueso('LeftForeArm', 0, 0, -g*0.6 - voz.pico*0.15); rotarHueso('LeftHand', 0, g*0.8, 0);
  rotarHueso('Head', R.cabeza.rotation.x, R.cabeza.rotation.y, R.cabeza.rotation.z);
}

encuadrar();
requestAnimationFrame(animar);
addEventListener('beforeunload', () => { try { estado.conv?.endSession(); } catch {} });
window.HD = { R, camera, controles, linea, llegaAudio, visemaTexto, boca: b => { bocaFija = b; }, fijar: (g, yaw) => { gestoForzado = g; Object.assign(poseI, GESTOS[g]); if (yaw !== undefined) cabezaRot.y = yaw; } };
</script>
